<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Hollow Identity - Furniture</title>
</head>

<body>
  <!-- FURNITURE: pickups and puzzle pieces never float. Each one lies on a real TABLE or on top of a low CLOSET (cabinet) that you can't walk through.
       items.html (the battery / medkit / flare / drink pickups) and escape.html (gems, notes, fuses, keys) both call furnBatch(world, tint):
         const B = furnBatch(world, furnTint(LV));
         const f = B.place(x, z, room, doors, seed);   // -> { x, z, y, yaw, kind }  where to put the thing, and the height of the surface it rests on
         parent.add(B.build());                          // ONE merged wood mesh + ONE merged trim mesh for the whole batch (very cheap)
       A closet is used when the spot is up against a room wall and well away from the door; otherwise a table. Colliders are added to world.walls. -->
  <script>
'use strict';
const FURN = { tableTop: .8, closetTop: 1.06, tw: 1.5, td: .85, cw: 1.15, cd: .55 };
const furnTint = (lv) => [0x5d6b4c, 0x7a5232, 0xa04b3a][Math.min(lv | 0, 2)];      // garden: mossy and weathered · library: dark oak · carnival: painted red boards

function furnBatch(world, tint) {
  const wood = [], trim = [], out = { placed: [] };
  world.walls = world.walls || [];
  // a box whose centre is at local (lx, ly, lz) of a piece sitting at (px, pz) turned by yaw
  const box = (arr, px, pz, yaw, w, h, d, lx, ly, lz) => {
    const c = Math.cos(yaw), s = Math.sin(yaw), g = new THREE.BoxGeometry(w, h, d);
    g.rotateY(yaw); g.translate(px + lx * c + lz * s, ly, pz - lx * s + lz * c); arr.push(g);
  };
  const addTable = (x, z, yaw) => {
    const { tw, td, tableTop } = FURN;
    box(wood, x, z, yaw, tw, .07, td, 0, tableTop - .035, 0);                                     // the top
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(wood, x, z, yaw, .07, tableTop - .07, .07, sx * (tw / 2 - .08), (tableTop - .07) / 2, sz * (td / 2 - .08));
    box(trim, x, z, yaw, tw - .22, .07, .03, 0, tableTop - .1, td / 2 - .08); box(trim, x, z, yaw, tw - .22, .07, .03, 0, tableTop - .1, -td / 2 + .08);       // aprons
    const swap = Math.abs(Math.sin(yaw)) > .5, ex = (swap ? td : tw) / 2, ez = (swap ? tw : td) / 2;
    world.walls.push({ x0: x - ex, x1: x + ex, z0: z - ez, z1: z + ez });
  };
  const addCloset = (x, z, yaw) => {                                                              // local +z is the front (the doors)
    const { cw, cd, closetTop } = FURN, bh = closetTop - .06;
    box(wood, x, z, yaw, cw, bh, cd, 0, bh / 2, 0);                                                // the body
    box(wood, x, z, yaw, cw + .07, .06, cd + .07, 0, closetTop - .03, .02);                          // the top slab
    box(trim, x, z, yaw, cw, .07, cd + .02, 0, .035, .01);                                         // plinth
    box(trim, x, z, yaw, .018, bh - .16, .02, 0, bh / 2, cd / 2 + .005);                           // gap between the two doors
    for (const sx of [-1, 1]) box(trim, x, z, yaw, .04, .16, .035, sx * .08, bh * .55, cd / 2 + .02);      // handles
    for (const sy of [.28, .6]) box(trim, x, z, yaw, cw - .14, .012, .02, 0, bh * sy + .2, cd / 2 + .004);      // door panel lines
    const swap = Math.abs(Math.sin(yaw)) > .5, ex = (swap ? cd : cw) / 2 + .03, ez = (swap ? cw : cd) / 2 + .03;
    world.walls.push({ x0: x - ex, x1: x + ex, z0: z - ez, z1: z + ez });
  };
  out.place = function (px, pz, room, doors, seed) {
    const T3 = 3.2, h = Math.abs(seed | 0); let x = px, z = pz, kind = 'table', yaw = (h % 2) ? Math.PI / 2 : 0;
    if (room) {
      const X0 = room.x0 * T3, X1 = (room.x0 + room.w) * T3, Z0 = room.y0 * T3, Z1 = (room.y0 + room.h) * T3;
      const dl = px - X0, dr = X1 - px, dt = pz - Z0, db = Z1 - pz, m = Math.min(dl, dr, dt, db);
      let nearDoor = false; for (const d of (doors || [])) if ((d.room === room || !d.room) && Math.hypot((d.tx + .5) * T3 - px, (d.ty + .5) * T3 - pz) < 5.4) nearDoor = true;
      if (m < 2.4 && !nearDoor && h % 3 !== 0) {                                                    // a closet against the nearest wall
        const hw = FURN.cw / 2 + .45;
        kind = 'closet';
        if (m === dl) { x = X0 + FURN.cd / 2 + .06; z = clamp(pz, Z0 + hw, Z1 - hw); yaw = Math.PI / 2; }
        else if (m === dr) { x = X1 - FURN.cd / 2 - .06; z = clamp(pz, Z0 + hw, Z1 - hw); yaw = -Math.PI / 2; }
        else if (m === dt) { z = Z0 + FURN.cd / 2 + .06; x = clamp(px, X0 + hw, X1 - hw); yaw = 0; }
        else { z = Z1 - FURN.cd / 2 - .06; x = clamp(px, X0 + hw, X1 - hw); yaw = Math.PI; }
      }
    }
    kind === 'closet' ? addCloset(x, z, yaw) : addTable(x, z, yaw);
    const r = { x, z, y: kind === 'closet' ? FURN.closetTop : FURN.tableTop, yaw, kind }; out.placed.push(r); return r;
  };
  out.build = function () {                                                                         // everything placed so far, as one Group (2 draw calls)
    const g = new THREE.Group(), wm = A.wood.clone(); wm.color.setHex(tint || 0x7a5232);
    if (wood.length) { const m = new THREE.Mesh(mergeGeos(wood), wm); m.frustumCulled = false; g.add(m); }
    if (trim.length) { const m = new THREE.Mesh(mergeGeos(trim), LitMat({ color: 0x24160d, roughness: .8 })); m.frustumCulled = false; g.add(m); }
    g.userData.dispose = () => g.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    return g;
  };
  return out;
}
  </script>
</body>

</html>
