<body>
  <!-- ESCAPE PROTOCOL: every level is a horror ESCAPE ROOM with its OWN way out. index.html loads this file and calls updateEscape(dt, t) every frame.
       The exit is SEALED (the gate glows red, sockets on it show your progress) until you solve that level's puzzle:
         Level 1 - GARDEN    "GEMS"  : three gems (emerald, ruby, sapphire) lie on weathered tables in the dead ends of the maze. Take all three and the seal breaks.
         Level 2 - LIBRARY   "CODE"  : four NOTES lie in the reading rooms, each one gives one digit of the exit code. One of those rooms is locked (red glow): its Rusty Key
                                       lies in another room. With the four digits, walk to the EXIT CONSOLE next to the exit, press E and type the code. A wrong code is loud.
         Level 3 - CARNIVAL  "FUSES" : the midway is dead. Three FUSES lie on tables in the tents. Carry them to the FUSE BOX out in the middle of the fairground and press E to slot each in
                                       (every clunk rings the carnival bell and draws the roamer over). When all three are in, the exit powers up.
       Everything you find lies on a table or on a closet (furniture.html) with a soft glow. They hum when you're near (press H for a hint, it costs nerve).
       Teammates share everything: finds, digits, unlocks and fuses that were slotted in.
       Breaking the seal starts THE FINAL HOUR (siren, blackouts, the roamer enraged, the Mimic sent after you, a light-pillar over the exit). DREAD (bottom-left) rises in the dark and near monsters.
       When you escape you get a report (time, hits, peak dread, rank S-C). Tune everything in the ESC object below. Console cheat for testing: escCheat(). -->
  <script>
'use strict';
// ---------- tuning ----------
const ESC = {
  hour: 150,               // seconds of the Final Hour
  ping: 17,                // finds hum from this far away (world units)
  hintCd: 45, hintCost: 7, // hint cooldown (s) · dread it costs
  reach: 3.1,              // pick-up / use range
  dread: { dark: 1.8, roamer: 5, mimic: 4, black: 5, hour: .9, calm: 3, team: 5, panic: 100, panicCd: 30 },
  mode: ['gems', 'code', 'fuses'],            // which puzzle each level uses (index = level)
  gems: [{ name: 'Emerald', icon: '🟢', col: 0x3cff9a }, { name: 'Ruby', icon: '🔴', col: 0xff3a5a }, { name: 'Sapphire', icon: '🔵', col: 0x4aa0ff }],
  gemLore: ['It is warm, like something was holding it.', 'It remembers rain.', 'It hums your name backwards.'],
  noteLore: ['It is in your handwriting. You never wrote it.', 'The ink is still wet.', 'Someone underlined it twice, in red.', 'The corner is stained. It smells like rain.'],
  codeLen: 4, fuses: 3, gemsN: 3,
  whispers: ['you are not alone', 'it is counting your breaths', 'turn the light on', 'it can smell the fear', 'do not run', 'it knows where you are', 'behind you']
};
const ES = {
  wld: null, lv: -1, mode: 'gems', t0: 0, objs: [], locks: [], need: 0, keys: 0, sealed: false, planned: false, mine: new Set(), seen: new Map(),
  code: '', solved: false, inserted: 0, carry: 0, station: null, noStation: false, furn: null,
  hourOn: false, hour: 0, hourDone: false, sirenT: 0, seals: [], sealTex: null, sealCv: null, beacon: null,
  dread: 0, peak: 0, hits: 0, hurt: 0, halT: 8, ambT: 25, heartT: 0, pingT: 0, hintT: 0, scanT: 0, briefT: 0,
  el: null, prompt: null, vig: null, pulse: null, banner: null, bannerT: 0, tgt: null, lastObj: '', lastPr: '', panic: 0, fell: 0,
  kp: { on: false, buf: '' }, kpEl: null
};
const eOn = () => typeof CFG === 'undefined' || CFG.scares !== false;
const eRng = (s) => mulberry32(hashStr(String(s)));
const eMode = () => ESC.mode[Math.min(LV, ESC.mode.length - 1)];

// ================= the seal on the way out =================
const _gateOpen = gateOpen, _setGateLook = setGateLook;
gateOpen = function () { return _gateOpen() && !ES.sealed; };
setGateLook = function (G, v) {                     // a sealed gate glows red and dim, with its sockets showing your progress
  _setGateLook(G, ES.sealed ? v * .15 : v);
  if (G.seal) G.seal.visible = ES.sealed && v > .02;
  if (G.glow && G.glow.material) G.glow.material.color.setHex(ES.sealed ? 0xff3344 : 0x66ffc8);
  if (G.light) G.light.col = ES.sealed ? 0xff3344 : 0x66ffc8;
  if (ES.sealed && G.light && v > .02) G.light.int = G.light.base * .6 * v;
};
function escProg() {                                 // how far along the puzzle is: { have, need }
  const m = ES.mode;
  if (m === 'fuses') return { have: ES.inserted, need: ES.need };
  const k = m === 'gems' ? 'gem' : 'note';
  return { have: ES.objs.filter(o => o.kind === k && o.taken).length, need: ES.need };
}
function escSealDraw() {
  const c = ES.sealCv || (ES.sealCv = document.createElement('canvas')); c.width = c.height = 256; const x = c.getContext('2d'), pr = escProg();
  x.clearRect(0, 0, 256, 256); x.lineWidth = 6; x.strokeStyle = 'rgba(255,60,70,.95)'; x.shadowColor = '#ff2030'; x.shadowBlur = 16;
  x.beginPath(); x.arc(128, 128, 96, 0, 7); x.stroke(); x.lineWidth = 3; x.beginPath(); x.arc(128, 128, 76, 0, 7); x.stroke();
  x.beginPath(); for (let i = 0; i < 3; i++) { const a = i / 3 * 6.283 - 1.57; x.moveTo(128 + Math.cos(a) * 30, 128 + Math.sin(a) * 30); x.lineTo(128 + Math.cos(a + 2.094) * 30, 128 + Math.sin(a + 2.094) * 30); } x.stroke();
  for (let i = 0; i < pr.need; i++) {
    const a = (i / pr.need) * 6.283 - 1.57, px = 128 + Math.cos(a) * 96, py = 128 + Math.sin(a) * 96, on = i < pr.have;
    const hex = ES.mode === 'gems' ? '#' + ESC.gems[i % ESC.gems.length].col.toString(16).padStart(6, '0') : ES.mode === 'fuses' ? '#ffd860' : '#9fe0ff';
    x.beginPath(); x.arc(px, py, 15, 0, 7); x.fillStyle = on ? hex : 'rgba(20,0,4,.9)'; x.fill(); x.strokeStyle = on ? '#ffffff' : '#ff4455'; x.lineWidth = 4; x.stroke();
  }
  if (ES.sealTex) ES.sealTex.needsUpdate = true;
}
function escSeals() {
  for (const s of ES.seals) if (s.parent) s.parent.remove(s);
  ES.seals = []; const gs = world.gates; if (!gs) return;
  escSealDraw(); if (!ES.sealTex) ES.sealTex = new THREE.CanvasTexture(ES.sealCv);
  const mat = new THREE.SpriteMaterial({ map: ES.sealTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: .9 });
  for (const G of gs) {
    if (!G.grp) continue;
    const s = new THREE.Sprite(mat); if (G.glow) { s.position.copy(G.glow.position); s.position.y = Math.max(1.6, s.position.y + .2); } else s.position.set(0, 1.8, 0);
    s.scale.set(3.4, 3.4, 1); G.grp.add(s); G.seal = s; ES.seals.push(s);
  }
}

// ================= planning: where everything hides (identical for everyone: seeded by the room code) =================
function escPlan(w) {
  const mode = eMode(), W = GW, H = GH, g = w.g, I = (x, y) => y * W + x, R = eRng(code + '|esc|' + LV);
  const sp = w.spawn || { x0: 8 * T, x1: 15 * T, z0: 46.5 * T, z1: 51.5 * T };
  let sx = Math.floor((sp.x0 + sp.x1) / 2 / T), sy = Math.floor((sp.z0 + sp.z1) / 2 / T);
  if (g[I(sx, sy)] !== 0) { let f = false; for (let r = 1; r < 8 && !f; r++)for (let y = sy - r; y <= sy + r && !f; y++)for (let x = sx - r; x <= sx + r && !f; x++) if (x > 0 && y > 0 && x < W - 1 && y < H - 1 && g[I(x, y)] === 0) { sx = x; sy = y; f = true; } if (!f) return null; }
  const dist = new Int16Array(W * H).fill(-1), q = [I(sx, sy)]; dist[q[0]] = 0; let maxD = 0;
  for (let h = 0; h < q.length; h++) {
    const c = q[h], cx = c % W, cy = (c / W) | 0; maxD = Math.max(maxD, dist[c]);
    for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = cx + ax, ny = cy + ay; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue; const ni = I(nx, ny); if (dist[ni] >= 0 || g[ni] !== 0) continue; dist[ni] = dist[c] + 1; q.push(ni); }
  }
  const shuf = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const tileOf = (x, y) => ({ x: (x + .5) * T + (R() - .5) * .6, z: (y + .5) * T + (R() - .5) * .6, tx: x, ty: y });
  const used = new Set((w.items || []).map(it => it.tx + ',' + it.ty));                                       // tiles that already hold a carnival pickup (and its furniture)
  const rooms = (w.rooms || []).filter(r => r.type === 2 && r.w * r.h >= 9).map(r => {
    const f = []; for (let y = r.y0; y < r.y0 + r.h; y++)for (let x = r.x0; x < r.x0 + r.w; x++) if (g[I(x, y)] === 0 && dist[I(x, y)] >= 0 && !used.has(x + ',' + y)) f.push([x, y]);
    return { r, f, d: f.length ? Math.min(...f.map(p => dist[I(p[0], p[1])])) : -1, cx: r.x0 + r.w / 2, cy: r.y0 + r.h / 2 };
  }).filter(o => o.f.length && o.d >= 0);
  const kind = mode === 'gems' ? 'gem' : mode === 'code' ? 'note' : 'fuse', n = mode === 'gems' ? ESC.gemsN : mode === 'code' ? ESC.codeLen : ESC.fuses;
  const spread = (list, k, gap) => { const out = []; for (const o of list) { if (out.length >= k) break; if (out.every(p => Math.hypot(p.cx - o.cx, p.cy - o.cy) >= gap)) out.push(o); } return out; };
  const objs = [], locks = [], picked = [];
  const useRooms = rooms.length >= n + (mode === 'code' ? 2 : mode === 'gems' ? 2 : 0);
  if (useRooms) {
    const far = shuf(rooms.filter(o => o.d >= 12));
    let pk = spread(far, n, 14); if (pk.length < n) pk = spread(far, n, 8); if (pk.length < n) pk = shuf(rooms.slice()).slice(0, n);
    pk.forEach((o, i) => { const [x, y] = o.f[(R() * o.f.length) | 0]; objs.push(Object.assign({ id: i, kind, gi: i, room: o.r }, tileOf(x, y))); picked.push(o); });
    if (mode === 'code') {                                                                                         // key -> locked room -> note
      const others = rooms.filter(o => !picked.includes(o) && o.d >= 3).sort((a, b) => a.d - b.d).slice(0, 4);
      if (others.length) { const k = others[(R() * others.length) | 0], [x, y] = k.f[(R() * k.f.length) | 0]; objs.push(Object.assign({ id: 0, kind: 'key', room: k.r }, tileOf(x, y))); locks.push({ id: 0, room: picked.slice().sort((a, b) => b.d - a.d)[0].r }); }
    }
  } else {                                                                                                         // no rooms to hide things in: use the dead ends of the maze
    const ends = []; for (let y = 1; y < H - 1; y++)for (let x = 1; x < W - 1; x++) {
      if (g[I(x, y)] !== 0 || dist[I(x, y)] < 18) continue;
      let k = 0; for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (g[I(x + ax, y + ay)] === 0) k++;
      if (k === 1) ends.push({ f: [[x, y]], cx: x, cy: y, d: dist[I(x, y)] });
    }
    let pool = shuf(ends), pk = spread(pool, n, 12); if (pk.length < n) pk = spread(pool, n, 6);
    if (pk.length < n) { const any = []; for (let y = 1; y < H - 1; y++)for (let x = 1; x < W - 1; x++) if (g[I(x, y)] === 0 && dist[I(x, y)] >= 20) any.push({ f: [[x, y]], cx: x, cy: y, d: dist[I(x, y)] }); pk = spread(shuf(any), n, 6); }
    pk.forEach((o, i) => objs.push(Object.assign({ id: i, kind, gi: i }, tileOf(o.f[0][0], o.f[0][1]))));
  }
  if (objs.filter(o => o.kind === kind).length < 1) return null;
  const need = objs.filter(o => o.kind === kind).length;
  let codeStr = ''; if (mode === 'code') { for (let i = 0; i < need; i++) codeStr += (R() * 10) | 0; if (/^(\d)\1+$/.test(codeStr)) codeStr = '4' + codeStr.slice(1).replace(/4/g, '7'); }
  // the machine you take things to
  let station = null;
  const open = (x, y) => x > 0 && y > 0 && x < W - 1 && y < H - 1 && g[I(x, y)] === 0 && dist[I(x, y)] >= 0, ex = w.exit || (w.sites && w.sites[0]);
  if (mode === 'code' && ex) {                                                                                     // the exit console, beside the exit
    const etx = Math.floor(ex.x / T), ety = Math.floor(ex.z / T);
    for (const [dx, dy] of [[-3, -3], [-3, 3], [-4, -2], [-4, 2], [-2, -3], [-2, 3], [-4, 0], [-5, 0], [-3, -2], [-3, 2]]) if (open(etx + dx, ety + dy)) { station = { kind: 'console', x: (etx + dx + .5) * T, z: (ety + dy + .5) * T }; break; }
  } else if (mode === 'fuses') {                                                                                   // the fuse box, out in an open part of the fairground
    let cand = [];
    for (const [lo, hi, nb] of [[.3, .62, 7], [.2, .8, 5], [.1, 1, 4]]) {                                          // an open spot, mid-map; relax the rules if the map has none
      cand = []; for (let y = 2; y < H - 2; y++)for (let x = 2; x < W - 2; x++) {
        if (!open(x, y) || (w.tt && w.tt[I(x, y)] === 2)) continue; const d = dist[I(x, y)]; if (d < maxD * lo || d > maxD * hi) continue;

// ================= meshes =================
function escMesh(kind, o) {                          // everything is built to LIE on a surface: its base is at y = 0
  const g = new THREE.Group(), bm = (c) => new THREE.MeshBasicMaterial({ color: c }), add = (geo, c, x, y, z) => { const m = new THREE.Mesh(geo, bm(c)); m.position.set(x, y, z); g.add(m); return m; };
  let col = 0xffe9a0;
  if (kind === 'gem') {
    col = ESC.gems[o.gi % ESC.gems.length].col; add(new THREE.CylinderGeometry(.1, .12, .03, 10), 0x1c1216, 0, .015, 0);
    add(new THREE.OctahedronGeometry(.11), col, 0, .16, 0).scale.y = 1.4;
  } else if (kind === 'note') {
    col = 0xfff0c0; add(new THREE.BoxGeometry(.3, .012, .4), 0xf2e8c4, 0, .006, 0);
    add(new THREE.BoxGeometry(.2, .014, .02), 0x802020, 0, .008, -.06); add(new THREE.BoxGeometry(.14, .014, .02), 0x802020, -.03, .008, .02); add(new THREE.BoxGeometry(.18, .014, .02), 0x802020, 0, .008, .09);
  } else if (kind === 'fuse') {
    col = 0xffd860; const t = add(new THREE.CylinderGeometry(.035, .035, .17, 10), 0xffe9a0, 0, .04, 0); t.rotation.z = Math.PI / 2;
    for (const s of [-1, 1]) add(new THREE.CylinderGeometry(.04, .04, .035, 10), 0x9a9a9a, s * .1, .04, 0).rotation.z = Math.PI / 2;
  } else {                                           // key
    col = 0xffd27a; add(new THREE.BoxGeometry(.3, .014, .04), 0xd9b45a, 0, .01, 0); const bow = add(new THREE.TorusGeometry(.06, .018, 6, 14), 0xd9b45a, -.18, .02, 0); bow.rotation.x = Math.PI / 2; add(new THREE.BoxGeometry(.04, .014, .09), 0xd9b45a, .12, .01, .05);
  }
  const mkGlow = (op) => new THREE.SpriteMaterial({ map: A.tex.glow, color: col, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: op });
  const halo = new THREE.Sprite(mkGlow(.45)); halo.scale.set(.95, .95, 1); halo.position.y = .12; g.add(halo); g.userData.halo = halo;
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: A.tex.glow, color: col, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: .55, side: THREE.DoubleSide }));
  pool.rotation.x = -Math.PI / 2; pool.scale.set(1.1, 1.1, 1); pool.position.y = .014; g.add(pool);

function escBuildStation(st) {                       // a pedestal you can't walk through: an exit console (library) or a fuse box (carnival)
  const g = new THREE.Group(), met = LitMat({ color: 0x2b3033, roughness: .55, metalness: .5 }), pm = (c) => new THREE.MeshBasicMaterial({ color: c });
  const add = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); g.add(o); return o; };
  add(new THREE.CylinderGeometry(.46, .54, .95, 12), met, 0, .475, 0); add(new THREE.CylinderGeometry(.56, .56, .1, 12), met, 0, 1.0, 0);
  const lamps = [], n = st.kind === 'fusebox' ? ES.need : 1;
  for (let i = 0; i < n; i++) {
    const a = n === 1 ? 0 : (i / n) * 6.283, r = n === 1 ? 0 : .34, x = Math.cos(a) * r, z = Math.sin(a) * r;
    const bulb = add(new THREE.SphereGeometry(.09, 10, 8), pm(0x551010), x, 1.12, z);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: A.tex.glow, color: 0xff3030, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: .8 })); sp.scale.set(.9, .9, 1); sp.position.set(x, 1.12, z); g.add(sp);

  if (st.kind === 'console') { add(new THREE.BoxGeometry(.5, .06, .36), pm(0x10202a), 0, 1.07, .12); for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) add(new THREE.BoxGeometry(.07, .02, .07), pm(0x9fd8ff), (c - 1) * .12, 1.1, .02 + r * .1); }

  const lampSet = (i, on) => { const l = lamps[i]; if (!l) return; l.bulb.material.color.setHex(on ? 0x66ffa0 : 0x551010); l.sp.material.color.setHex(on ? 0x66ffa0 : 0xff3030); };

function escSetup() {                                // build this level's puzzle

  const plan = escPlan(w);
  if (!plan) { ES.need = 0; ES.sealed = false; return; }
  ES.need = plan.need; ES.code = plan.code; ES.sealed = true; ES.solved = false; ES.inserted = 0; ES.carry = 0; ES.keys = 0;
  w.walls = w.walls || [];
  const B = furnBatch(w, furnTint(LV));
  for (const o of plan.objs) {
    const f = B.place(o.x, o.z, o.room, w.doors, o.id * 5 + o.tx + (o.kind === 'key' ? 3 : 0));      // it lies on a table or on top of a closet
    o.x = f.x; o.z = f.z; o.y = f.y; o.grp = escMesh(o.kind, o); o.grp.position.set(f.x, f.y, f.z); o.grp.rotation.y = (o.id * 2.1 + o.tx) % 6.283;

function escClear() {
  for (const o of ES.objs) { if (o.grp) scene.remove(o.grp); if (o.light) DYN.delete(o.light); }
  for (const l of ES.locks) for (const s of l.sprites) scene.remove(s);
  if (ES.furn) { scene.remove(ES.furn); if (ES.furn.userData.dispose) ES.furn.userData.dispose(); }
  if (ES.station) scene.remove(ES.station.grp);
  if (ES.beacon) { scene.remove(ES.beacon); ES.beacon = null; }
  for (const s of ES.seals) if (s.parent) s.parent.remove(s);
  Object.assign(ES, { objs: [], locks: [], seals: [], need: 0, keys: 0, sealed: false, planned: false, hourOn: false, hour: 0, hourDone: false, mine: new Set(), seen: new Map(), tgt: null, hintT: 0, briefT: 0, halT: 8, ambT: 25, pingT: 0, panic: 0,
    code: '', solved: false, inserted: 0, carry: 0, station: null, noStation: false, furn: null, kp: { on: false, buf: '' } });
  if (ES.kpEl) ES.kpEl.style.opacity = 0;
  if (typeof roamRage === 'function') roamRage(false);

  if (ES.keys) st2 = (st2 ? st2 + ' · ' : '') + '🔑 ×' + ES.keys;
  const st = ES.hourOn ? (P.escaped ? 'OUT' : ES.hourDone ? 'IT IS HERE' : 'ESCAPE ' + String(Math.floor(ES.hour / 60)).padStart(2, '0') + ':' + String(Math.floor(ES.hour % 60)).padStart(2, '0')) : ES.sealed ? 'EXIT SEALED' : 'EXIT OPEN';
  const key = a + '|' + b + '|' + st + '|' + st2; if (key !== ES.lastObj) {
    ES.lastObj = key; $('#escRel').textContent = a; $('#escRelN').textContent = b; const s = $('#escSt'); s.textContent = st; s.style.color = ES.hourOn ? '#ff6a76' : ES.sealed ? '#ff9a8a' : '#8dffc4'; $('#escSt2').textContent = st2;
  }
  $('#escDrF').style.width = ES.dread + '%'; $('#escDrN').textContent = Math.round(ES.dread) + '%';
}
function escBrief() {
  const m = ES.mode;
  if (!ES.need) return;
  if (m === 'gems') escBanner('THE EXIT IS SEALED', 'Three gems lie on old tables in the dead ends of the maze (🟢🔴🔵). They hum when you are close. Press H for a hint.', 9);
  else if (m === 'code') escBanner('THE EXIT IS SEALED', 'Four notes hide the digits of the exit code. Find them all, then type the code into the console beside the exit. Press H for a hint.', 9);
  else escBanner('THE MIDWAY IS DEAD', 'Find ' + ES.need + ' fuses (🔌) in the tents and slot them into the fuse box out on the fairground. The bell will ring. Press H for a hint.', 9);
}

// ================= main update =================
function updateEscape(dt, t) {
  escHook();
  if (!started || !world) { if (ES.wld) { escClear(); ES.wld = null; } return; }
  if (P.escaped) { if (ES.beacon) ES.beacon.visible = false; kpClose(); return; }
  escUi();
  if (ES.wld !== world) { escClear(); ES.wld = world; ES.lv = LV; if (!ES.t0) ES.t0 = performance.now(); escSetup(); ES.briefT = 5; }
  if (P.freeze || paused) return;
  if (ES.bannerT > 0) { ES.bannerT -= dt; if (ES.bannerT <= 0 && ES.banner) ES.banner.style.opacity = 0; }
  if (ES.briefT > 0) { ES.briefT -= dt; if (ES.briefT <= 0) escBrief(); }
  ES.hintT = Math.max(0, ES.hintT - dt);
  // finds: they lie still on their furniture and breathe a faint glow; they hum when you are near
  let nearest = 1e9, nearO = null;
  for (const o of ES.objs) {
    if (o.taken) continue; const dx = o.x - P.x, dz = o.z - P.z, d = Math.hypot(dx, dz), near = d < 44; o.grp.visible = near;
    if (near) o.grp.userData.halo.material.opacity = .4 + Math.sin(t * 2 + o.ph) * .12;
    if (d < nearest) { nearest = d; nearO = o; }
  }
  if (nearO && nearest < ESC.ping) {
    ES.pingT -= dt; if (ES.pingT <= 0) { const k = nearest / ESC.ping; ES.pingT = .3 + k * 1.7; const f = { key: 1568, fuse: 1318, note: 880, gem: 1046 }[nearO.kind]; Aud.tone(f, f * .98, .16, .015 + .05 * (1 - k), 'sine'); }
  }
  // the machine
  if (ES.station) {
    const st = ES.station; st.grp.visible = Math.abs(P.x - st.x) < 60 && Math.abs(P.z - st.z) < 60;
    if (ES.mode === 'code') st.lampSet(0, !ES.sealed);
    if (ES.mode === 'fuses') for (let i = 0; i < ES.need; i++) st.lampSet(i, i < ES.inserted);
    if (ES.kp.on && Math.hypot(P.x - st.x, P.z - st.z) > 5) kpClose();
  }
  // prompts
  const tg = escTarget(); let txt = '';
  if (tg && tg.type === 'obj') { const k = tg.o.kind; txt = '[E]  ' + (k === 'gem' ? 'Take 💎 ' + ESC.gems[tg.o.gi % ESC.gems.length].name + ' gem' : k === 'note' ? 'Read 📜 note' : k === 'fuse' ? 'Take 🔌 fuse' : 'Take 🔑 Rusty Key'); }
  else if (tg && tg.type === 'lock') txt = ES.keys > 0 ? '[E]  Unlock with 🔑 Rusty Key' : 'Locked 🔒  — find the key';
  else if (tg && tg.type === 'station') txt = !ES.sealed ? 'Done. Run for the exit.' : ES.mode === 'code' ? '[E]  Enter the exit code' : ES.carry > 0 ? '[E]  Slot in 🔌 fuse (' + ES.inserted + '/' + ES.need + ')' : 'The fuse box needs ' + (ES.need - ES.inserted) + ' fuse' + (ES.need - ES.inserted === 1 ? '' : 's');
  else if (ES.sealed && world.exit && Math.hypot(P.x - world.exit.x, P.z - world.exit.z) < 7) { const pr = escProg(); txt = ES.mode === 'code' ? 'The exit is sealed — it wants a ' + ES.need + '-digit code (' + pr.have + '/' + pr.need + ' notes found)' : ES.mode === 'fuses' ? 'The exit has no power (' + ES.inserted + '/' + ES.need + ' fuses)' : 'The exit is sealed — ' + pr.have + '/' + pr.need + ' gems'; }
  if (ES.kp.on) txt = '';
  if (txt !== ES.lastPr) { ES.prompt.textContent = txt; ES.lastPr = txt; if (isTouch) ES.prompt.style.pointerEvents = txt && tg ? 'auto' : 'none'; }
  ES.prompt.style.opacity = txt ? 1 : 0;
  // teammates: finds, unlocks, slotted fuses, the code
  ES.scanT -= dt;
  if (ES.scanT <= 0 && typeof net !== 'undefined' && net.r) {
    ES.scanT = .3;
    for (const p of net.r.peers()) {
      if (p.isMe) continue; const s = p.presence && p.presence.es; if (typeof s !== 'string' || ES.seen.get(p.peer) === s) continue;
      ES.seen.set(p.peer, s); const parts = s.split(';'); if ((+parts[0] | 0) !== LV || !parts[1]) continue;
      for (const tk of parts[1].split(',')) {
        const id = +tk.slice(1) | 0, c = tk[0];
        if (c === 'r') { const o = ES.objs.find(q => q.kind !== 'key' && q.id === id); if (o && !o.taken) escTake(o, false); }
        else if (c === 'k') { const o = ES.objs.find(q => q.kind === 'key' && q.id === id); if (o && !o.taken) escTake(o, false); }
        else if (c === 'u') { const lk = ES.locks.find(q => q.id === id); if (lk) escUnlock(lk, false); }
        else if (c === 'f') { if (ES.mode === 'fuses') while (ES.inserted < id + 1) escFuseIn(false); }
        else if (c === 'c') { if (!ES.solved && ES.mode === 'code') { ES.solved = true; toast('A teammate entered the code.'); escCheck(); } }
      }
    }
  }
  escHourTick(dt, t); escDreadTick(dt, t); escAmbient(dt); escHud();
}

// ================= the report =================
let escHooked = false;
function escHook() {                                  // the main game script loads AFTER the modules, so these wrappers are installed on the first frame
  if (escHooked) return; escHooked = true;
  const dp = damagePlayer;
  damagePlayer = function (n) { if (!P.escaped && P.down <= 0 && started) { ES.hits++; ES.hurt += n; } return dp(n); };
  const de = doEscape;
  doEscape = function () {
    de();
    try {
      const sec = Math.max(1, Math.round((performance.now() - ES.t0) / 1000)), mm = Math.floor(sec / 60), ss = String(sec % 60).padStart(2, '0');
      const score = sec / 60 + ES.hits * 1.5 + ES.fell * 2, rank = score < 16 ? 'S' : score < 26 ? 'A' : score < 40 ? 'B' : 'C';
      const e = $('#escSub'); e.innerHTML = e.textContent + '<br><span style="display:inline-block;margin-top:10px;font-size:14px;opacity:.9">⏱ ' + mm + ':' + ss + ' &nbsp;·&nbsp; 🩸 hits taken ' + ES.hits + ' &nbsp;·&nbsp; 😨 peak dread ' + Math.round(ES.peak) + '% &nbsp;·&nbsp; nerve broken ' + ES.fell + '×</span><br><span style="font-size:28px;font-weight:700;letter-spacing:.2em;color:#ffc27a">RANK ' + rank + '</span>';
      if (ES.vig) ES.vig.style.opacity = 0; if (ES.pulse) ES.pulse.style.opacity = 0; if (ES.prompt) ES.prompt.style.opacity = 0; if (ES.banner) ES.banner.style.opacity = 0; kpClose();
    } catch (err) { }
  };
}
// handy for testing: type escCheat() in the console to solve this level's puzzle
window.escCheat = function () {
  for (const o of ES.objs) if (!o.taken && o.kind !== 'fuse') escTake(o, true);
  for (const l of ES.locks) escUnlock(l, true);
  if (ES.mode === 'fuses') { for (const o of ES.objs) if (!o.taken) escTake(o, true); while (ES.carry > 0) escFuseIn(true); }
  if (ES.mode === 'code' && ES.sealed) { ES.solved = true; escCheck(); }
  return ES.mode + ' solved: ' + !ES.sealed;
};
