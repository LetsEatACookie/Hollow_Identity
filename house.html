<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Hollow Identity - Home</title>
</head>

<body>
  <!-- ALL ABOUT THE HOUSE (the P.T. / Visage level between the garden and the library): generator + builder + the loop.
       index.html loads this file at start-up and runs the script below as part of the game. You get here through the garden's way out;
       the house's way out is the library (libEnter in library.html accepts a player coming from here).

       How it works: the house is ONE fixed L-shaped hallway with a cosy living room and kitchen off it. At the far end there is a door.
       Walk through it and you are put back at the start of the SAME hallway, but a little bit off (houseMake(n) rebuilds the whole house for pass n).
       Every pass is a little worse: crooked pictures, doors ajar, a TV that is on, a hallway that gets narrower and lower, lights that flicker,
       tally marks on the wall, something standing at the corner. After HOUSE.loops bad passes the next pass is calm again, and that door is the real way out.
       Nothing here is random per player: pass n is seeded from the room code, so everybody sees the same house, but each player counts their own loops.
       Everything is wrapped in a function so none of its names can clash with the other files (they all share one global scope). -->
  <script>
'use strict';
(function () {

// ---------- tuning ----------
const HOUSE = {
  loops: 8,                 // how many "wrong" passes before the real way out (the pass after that is calm again, and its door is the exit)
  cozyCH: 2.9,              // ceiling height on the calm pass (it sinks a little every loop)
  fogColor: 0x0d0907, fog: .03, fogNight: .02, hemi: .7,
  mm: 6                     // minimap pixels per tile
};
const XE = 27.5, ZS = 27.5, CZ = 11.4;          // east wall x · south wall z · the hallway's centre line z (metres)
const TW = .22;                                  // wall thickness
const HS = { n: 0, busy: false, active: false, hooked: false, root: null, dyn: null, gh: null, ev: {}, vig: null, fade: null };

// ---------- helpers ----------
const rad = (d) => d * Math.PI / 180;
const FACE = { '+z': 0, '-z': Math.PI, '+x': Math.PI / 2, '-x': -Math.PI / 2 };       // which way a wall-mounted thing looks -> its yaw
function mount(fc, wc, along, off) { return fc === '+z' ? [along, wc + off] : fc === '-z' ? [along, wc - off] : fc === '+x' ? [wc + off, along] : [wc - off, along]; }
function loc(o, ry, u, v) { return [o[0] + u * Math.cos(ry) + v * Math.sin(ry), o[1] - u * Math.sin(ry) + v * Math.cos(ry)]; }   // local (u across, v out of the wall) -> world
function hDims(n) {
  const L = HOUSE.loops, fin = n >= L, bad = fin ? 0 : Math.min(1, n / (L - 1));
  const HW = 2.5 - .62 * bad, CH = HOUSE.cozyCH - .5 * bad;
  return { n, fin, bad, HW, CH, hz0: CZ - HW / 2, hz1: CZ + HW / 2, bx0: XE - HW, cxE: XE - HW / 2 };
}
function hVar(n, D) {
  const aj = {};
  if (!D.fin) {
    if (n >= 2) aj.N1 = .16; if (n >= 3) aj.W1 = .22; if (n >= 4) { aj.S2 = .35; aj.N1 = .5; } if (n >= 5) { aj.E1 = .3; aj.W2 = .6; }
    if (n >= 6) { aj.X1 = .2; aj.S1 = .9; aj.N2 = .14; } if (n >= 7) { aj.N1 = 1.2; aj.W1 = 1.0; aj.S2 = 1.35; }
  }
  return {
    ajar: aj, face: D.fin ? 0 : n < 2 ? 0 : n < 4 ? 1 : n < 6 ? 2 : n < 7 ? 3 : 4,
    tvOn: !D.fin && n >= 3, fire: D.fin || n < 4, clock: D.fin || n < 3 ? 1 : n < 6 ? 0 : 2, offHook: !D.fin && n >= 1,
    sofaTurned: !D.fin && n >= 4, fridgeOpen: !D.fin && n >= 5, figure: !D.fin && n >= 5, extraDoor: !D.fin && n >= 6,
    tilt: D.fin ? 0 : n < 1 ? 0 : n < 3 ? .25 : n < 5 ? .5 : 1

}
const lampCol = (b) => { const r = 255, g = Math.round(214 - 100 * b), bl = Math.round(158 - 100 * b); return (r << 16) | (g << 8) | bl; };

// ---------- textures + materials (made once, kept between passes) ----------
const HA = {};
function hAssets() {
  if (HA.mat) return;
  const S = 256, t = HA.tex = {};
  t.wp = mk(S, S, (x) => {
    x.fillStyle = '#cdb98f'; x.fillRect(0, 0, S, S);
    for (let i = 0; i < 4; i++) { x.fillStyle = i % 2 ? '#dccba2' : '#c3ae83'; x.fillRect(i * S / 4, 0, S / 4, S); }
    x.fillStyle = 'rgba(110,80,45,.2)';
    for (let i = 0; i < 4; i++)for (let j = 0; j < 4; j++) { const cx = i * S / 4 + S / 8, cy = (j * S / 4 + S / 8 + (i % 2) * S / 8) % S; x.beginPath(); x.ellipse(cx, cy, 4, 10, 0, 0, 7); x.fill(); x.beginPath(); x.ellipse(cx, cy, 10, 4, 0, 0, 7); x.fill(); x.beginPath(); x.arc(cx, cy, 3, 0, 7); x.fill(); }
    x.fillStyle = 'rgba(70,45,20,.2)'; for (let i = 0; i < 4; i++) x.fillRect(i * S / 4 - 1, 0, 2, S);
    grain(x, S, S, 9);
  });
  t.wn = mk(S, S, (x) => {
    x.fillStyle = '#2f1c10'; x.fillRect(0, 0, S, S);
    for (let i = 0; i < 2; i++) { const px = i * S / 2 + 14; x.fillStyle = '#46291a'; x.fillRect(px, 16, S / 2 - 28, S - 32); x.strokeStyle = '#1d1008'; x.lineWidth = 4; x.strokeRect(px, 16, S / 2 - 28, S - 32); x.strokeStyle = 'rgba(255,200,140,.12)'; x.lineWidth = 2; x.strokeRect(px + 8, 24, S / 2 - 44, S - 48); }
    grain(x, S, S, 10);
  });
  t.fl = mk(S, S, (x) => {
    x.fillStyle = '#2a1a10'; x.fillRect(0, 0, S, S); const rows = 8, rh = S / rows;
    for (let r = 0; r < rows; r++) {
      let px = -TR() * S * .5;
      while (px < S) {
        const w = S * (.35 + TR() * .4); x.fillStyle = `hsl(${24 + TR() * 8},${38 + TR() * 14}%,${20 + TR() * 10}%)`; x.fillRect(px + 1, r * rh + 1, w - 2, rh - 2);
        for (let k = 0; k < 5; k++) { x.strokeStyle = `rgba(0,0,0,${.06 + TR() * .12})`; x.lineWidth = 1; const y = r * rh + 3 + TR() * (rh - 6); x.beginPath(); x.moveTo(px + 2, y); x.lineTo(px + w - 2, y + (TR() - .5) * 2); x.stroke(); }
        px += w;
      }
    }
    grain(x, S, S, 12);
  });
  t.ce = mk(S, S, (x) => { x.fillStyle = '#cdc2a8'; x.fillRect(0, 0, S, S); for (let i = 0; i < 18; i++)blob(x, S, TR() * S, TR() * S, 20 + TR() * 50, 'rgba(90,70,40,A)', .1); grain(x, S, S, 8); });
  t.rg = mk(S, S, (x) => {
    x.fillStyle = '#5e1b22'; x.fillRect(0, 0, S, S); x.fillStyle = '#c9a24f'; x.fillRect(0, 0, 10, S); x.fillRect(S - 10, 0, 10, S); x.fillStyle = '#2a0c10'; x.fillRect(10, 0, 6, S); x.fillRect(S - 16, 0, 6, S);
    x.strokeStyle = '#d8b868'; x.lineWidth = 3;
    for (let j = 0; j < 2; j++) { const cy = j * S / 2 + S / 4; x.beginPath(); x.moveTo(S / 2, cy - S / 4 + 14); x.lineTo(S - 34, cy); x.lineTo(S / 2, cy + S / 4 - 14); x.lineTo(34, cy); x.closePath(); x.stroke(); x.fillStyle = 'rgba(200,150,70,.35)'; x.beginPath(); x.arc(S / 2, cy, 16, 0, 7); x.fill(); }
    grain(x, S, S, 14);
  });
  t.ck = mk(S, S, (x) => { for (let r = 0; r < 4; r++)for (let c = 0; c < 4; c++) { x.fillStyle = (r + c) % 2 ? '#1c1613' : '#b8a88a'; x.fillRect(c * S / 4, r * S / 4, S / 4, S / 4); } for (let i = 0; i < 20; i++)blob(x, S, TR() * S, TR() * S, 14 + TR() * 30, 'rgba(0,0,0,A)', .14); grain(x, S, S, 10); });
  t.dr = mk(S, S, (x) => {
    x.fillStyle = '#5a3a22'; x.fillRect(0, 0, S, S);
    for (const [py, ph] of [[18, 98], [138, 98]]) { x.fillStyle = '#4a2e1a'; x.fillRect(36, py, S - 72, ph); x.strokeStyle = '#2c180c'; x.lineWidth = 4; x.strokeRect(36, py, S - 72, ph); x.strokeStyle = 'rgba(255,210,150,.14)'; x.lineWidth = 2; x.strokeRect(44, py + 8, S - 88, ph - 16); }
    grain(x, S, S, 10);
  });
  t.cu = mk(64, 128, (x, w, h) => { for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? '#7a3a28' : '#6a2f20'; x.fillRect(i * w / 8, 0, w / 8 + 1, h); } const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(0,0,0,.3)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, w, h); grain(x, w, h, 10); });
  t.moon = mk(128, 192, (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#16233f'); g.addColorStop(1, '#0a1020'); x.fillStyle = g; x.fillRect(0, 0, w, h); const m = x.createRadialGradient(w * .66, h * .28, 0, w * .66, h * .28, 40); m.addColorStop(0, 'rgba(230,240,255,1)'); m.addColorStop(.25, 'rgba(190,210,250,.6)'); m.addColorStop(1, 'rgba(120,150,230,0)'); x.fillStyle = m; x.fillRect(0, 0, w, h); }, { repeat: false });
  t.warm = mk(128, 128, (x, w, h) => { const g = x.createRadialGradient(w / 2, h / 2, 4, w / 2, h / 2, w * .75); g.addColorStop(0, '#fff0c8'); g.addColorStop(.5, '#e8a25a'); g.addColorStop(1, '#6a3a14'); x.fillStyle = g; x.fillRect(0, 0, w, h); }, { repeat: false });
  t.sil = mk(64, 128, (x, w, h) => { x.fillStyle = '#05070c'; x.beginPath(); x.arc(w / 2, 30, 15, 0, 7); x.fill(); x.beginPath(); x.moveTo(w / 2 - 8, 44); x.lineTo(w / 2 + 8, 44); x.lineTo(w - 6, h); x.lineTo(6, h); x.closePath(); x.fill(); }, { repeat: false });
  const lm = (o) => LitMat(o), bm = (c) => new THREE.MeshBasicMaterial({ color: c });
  t.wp.anisotropy = t.wn.anisotropy = 4;
  HA.mat = {
    wp: lm({ map: t.wp }), wn: lm({ map: t.wn }), rg: lm({ map: t.rg }), ck: lm({ map: t.ck }), dr: lm({ map: t.dr }), cu: lm({ map: t.cu }),
    fl: lm({ map: t.fl }), ce: lm({ map: t.ce }),
    tr: lm({ color: 0xcdbd9c }), wd: lm({ color: 0x4a2f1c }), wl: lm({ color: 0x8a6238 }), fg: lm({ color: 0x35503f }), fr: lm({ color: 0x7a3a26 }), fc: lm({ color: 0xc8b896 }),
    br: lm({ color: 0xb08a3a }), wh: lm({ color: 0xd8d4c8 }), mt: lm({ color: 0x2a2a2e }), pl: lm({ color: 0x2e5a2c }), pt: lm({ color: 0x8a4a2a }), fz: lm({ color: 0xbfc4c0 }), bk: lm({ color: 0x15110f }),
    bl: bm(0x000000), gl: bm(0xffe0a8), gb: bm(0x7a9ac8)
  };
}

// ---------- batching: lots of little boxes -> a handful of meshes ----------
function hBoxGeo(w, h, d, tile) {
  const g = new THREE.BoxGeometry(w, h, d);
  if (tile) { const uv = g.attributes.uv, dm = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]]; for (let f = 0; f < 6; f++)for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * dm[f][0] / tile, uv.getY(k) * dm[f][1] / tile); } }
  return g;
}
class Batch {
  constructor() { this.m = new Map(); }
  push(k, g) { let a = this.m.get(k); if (!a) this.m.set(k, a = []); a.push(g); }
  box(k, w, h, d, x, y, z, o = {}) { const g = hBoxGeo(w, h, d, o.tile); if (o.rx) g.rotateX(o.rx); if (o.rz) g.rotateZ(o.rz); if (o.ry) g.rotateY(o.ry); g.translate(x, y, z); this.push(k, g); }
  plane(k, w, h, x, y, z, o = {}) { const g = new THREE.PlaneGeometry(w, h); if (o.rz) g.rotateZ(o.rz); if (o.rx) g.rotateX(o.rx); if (o.ry) g.rotateY(o.ry); g.translate(x, y, z); this.push(k, g); }
  cyl(k, rt, rb, h, x, y, z, seg = 10) { const g = new THREE.CylinderGeometry(rt, rb, h, seg); g.translate(x, y, z); this.push(k, g); }
  ball(k, r, x, y, z) { const g = new THREE.SphereGeometry(r, 10, 8); g.translate(x, y, z); this.push(k, g); }
  build(root) { for (const [k, a] of this.m) { const geo = mergeGeos(a); for (const g of a) g.dispose(); const me = new THREE.Mesh(geo, HA.mat[k]); me.matrixAutoUpdate = false; root.add(me); } }
}

// ---------- pictures on the walls (painted on a canvas; the faces change with every pass) ----------
function hPicTex(kind, st, seed) {
  const W = kind === 'wed' ? 128 : kind === 'vase' ? 112 : 160, H = kind === 'wed' ? 160 : kind === 'vase' ? 144 : kind === 'fam' ? 128 : 112;
  return mk(W, H, (x) => {
    const R = mulberry32(seed);
    const face = (cx, cy, r, i) => {
      x.fillStyle = '#e2c59a'; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill();
      if (st === 0 || (st === 1 && i !== 0)) { x.fillStyle = '#2a1c14'; x.beginPath(); x.arc(cx - r * .35, cy - r * .1, r * .1, 0, 7); x.arc(cx + r * .35, cy - r * .1, r * .1, 0, 7); x.fill(); x.strokeStyle = '#6a3a2a'; x.lineWidth = 1.5; x.beginPath(); x.arc(cx, cy + r * .1, r * .4, .2, Math.PI - .2); x.stroke(); }
      else if (st === 1) { const g = x.createRadialGradient(cx, cy, 0, cx, cy, r * 1.2); g.addColorStop(0, 'rgba(10,6,4,.95)'); g.addColorStop(1, 'rgba(10,6,4,0)'); x.fillStyle = g; x.fillRect(cx - r * 1.3, cy - r * 1.3, r * 2.6, r * 2.6); }
      else if (st === 3) { x.fillStyle = '#050303'; x.beginPath(); x.ellipse(cx - r * .38, cy - r * .1, r * .2, r * .3, 0, 0, 7); x.ellipse(cx + r * .38, cy - r * .1, r * .2, r * .3, 0, 0, 7); x.fill(); }
      else if (st === 4) { x.strokeStyle = '#7a0d12'; x.lineWidth = 2; x.beginPath(); for (let k = 0; k < 14; k++) { x.moveTo(cx - r + R() * r * 2, cy - r + R() * r * 2); x.lineTo(cx - r + R() * r * 2, cy - r + R() * r * 2); } x.stroke(); }
    };
    if (kind === 'fam' || kind === 'wed') {
      x.fillStyle = '#b79c72'; x.fillRect(0, 0, W, H); const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(255,240,200,.25)'); g.addColorStop(1, 'rgba(40,20,0,.35)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
      const fig = kind === 'fam' ? [[.28, .5, 18], [.5, .42, 20], [.72, .5, 18], [.5, .7, 12]] : [[.38, .42, 20], [.64, .42, 20]];
      fig.forEach(([fx, fy, r], i) => { x.fillStyle = i % 2 ? '#3a2a22' : '#2a2430'; x.beginPath(); x.ellipse(fx * W, (fy + .3) * H, r * 1.5, r * 2.1, 0, 0, 7); x.fill(); face(fx * W, fy * H + 2, r, i); });
    } else if (kind === 'land') {
      const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#d9b97a'); g.addColorStop(.6, '#8a6a4a'); g.addColorStop(1, '#3a4a30'); x.fillStyle = g; x.fillRect(0, 0, W, H);
      x.fillStyle = '#4a5a3a'; x.beginPath(); x.moveTo(0, H * .7); x.quadraticCurveTo(W * .3, H * .45, W * .6, H * .66); x.quadraticCurveTo(W * .85, H * .5, W, H * .62); x.lineTo(W, H); x.lineTo(0, H); x.fill();
      x.fillStyle = '#2a1c14'; x.fillRect(W * .55, H * .55, 16, 12); x.beginPath(); x.moveTo(W * .55 - 3, H * .55); x.lineTo(W * .55 + 8, H * .55 - 10); x.lineTo(W * .55 + 19, H * .55); x.fill();
      if (st >= 2) { x.fillStyle = '#05030a'; x.fillRect(W * .55 + 5, H * .55 + 4, 5, 8); }
    } else if (kind === 'vase') {
      x.fillStyle = '#c9b48a'; x.fillRect(0, 0, W, H); x.fillStyle = '#3a5a6a'; x.beginPath(); x.ellipse(W / 2, H * .72, 22, 30, 0, 0, 7); x.fill(); x.fillRect(W / 2 - 8, H * .4, 16, 20);
      x.strokeStyle = '#3a5a2a'; x.lineWidth = 2; for (let k = 0; k < 5; k++) { x.beginPath(); x.moveTo(W / 2, H * .42); x.lineTo(W / 2 - 24 + k * 12, H * .12 + (k % 2) * 10); x.stroke(); x.fillStyle = st >= 3 ? '#7a0d12' : '#d86a7a'; x.beginPath(); x.arc(W / 2 - 24 + k * 12, H * .12 + (k % 2) * 10, 6, 0, 7); x.fill(); }
    } else {
      x.fillStyle = '#e8dcc0'; x.fillRect(0, 0, W, H); x.strokeStyle = '#d4a020'; x.lineWidth = 3; x.beginPath(); x.arc(W * .8, H * .22, 12, 0, 7); x.stroke();
      x.fillStyle = '#b8402a'; x.fillRect(W * .3, H * .5, 44, 34); x.beginPath(); x.moveTo(W * .3 - 4, H * .5); x.lineTo(W * .3 + 22, H * .3); x.lineTo(W * .3 + 48, H * .5); x.fill();
      x.strokeStyle = '#2a2a2a'; x.lineWidth = 2; [[.2, .62], [.5, .85]].forEach(([a, b], i) => { x.beginPath(); x.arc(a * W, b * H - 14, 5, 0, 7); x.moveTo(a * W, b * H - 9); x.lineTo(a * W, b * H + 6); x.stroke(); if (st >= 2 && i === 1) { x.fillStyle = '#2a2a2a'; x.beginPath(); x.arc(a * W, b * H - 14, 5, 0, 7); x.fill(); } });
    }
    grain(x, W, H, 12);
  }, { repeat: false });
}

// ---------- the house ----------
function hClockTex(mode) {        // a clock face: mode 1 running (twenty to ten), 0 stopped at three, 2 wrong
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'), t = new THREE.CanvasTexture(c);
  const draw = (hr, mn) => {
    x.fillStyle = '#d8ccae'; x.fillRect(0, 0, 128, 128); x.strokeStyle = '#3a2a1a'; x.lineWidth = 4; x.beginPath(); x.arc(64, 64, 58, 0, 7); x.stroke();
    for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283; x.lineWidth = i % 3 ? 2 : 4; x.beginPath(); x.moveTo(64 + Math.sin(a) * 48, 64 - Math.cos(a) * 48); x.lineTo(64 + Math.sin(a) * 55, 64 - Math.cos(a) * 55); x.stroke(); }
    x.lineCap = 'round'; x.lineWidth = 5; x.beginPath(); x.moveTo(64, 64); x.lineTo(64 + Math.sin(hr) * 28, 64 - Math.cos(hr) * 28); x.stroke();
    x.lineWidth = 3; x.beginPath(); x.moveTo(64, 64); x.lineTo(64 + Math.sin(mn) * 44, 64 - Math.cos(mn) * 44); x.stroke(); t.needsUpdate = true;
  };
  draw(mode === 0 ? Math.PI / 2 : 5.1, mode === 0 ? 0 : 4.0); return { tex: t, draw };
}

function houseMake(n) {
  hAssets();
  const D = hDims(n), V = hVar(n, D), R = mulberry32(hashStr(String(code) + '|home|' + n)), { CH, hz0, hz1, bx0, cxE, bad } = D;
  GW = Math.ceil((XE + 2) / T) + 1; GH = Math.ceil((ZS + 2.5) / T) + 1;
  const g = new Uint8Array(GW * GH).fill(1), tt = new Uint8Array(GW * GH), kd = new Uint8Array(GW * GH);
  const walls = [], root = new THREE.Group(); scene.add(root);
  const S = new Batch(), dyn = { n, D, V, doors: [], lights: [] };
  const lampC = lampCol(bad);
  const carve = (x0, z0, x1, z1) => { for (let ty = Math.floor(z0 / T); ty <= Math.floor((z1 - .01) / T); ty++)for (let tx = Math.floor(x0 / T); tx <= Math.floor((x1 - .01) / T); tx++) if (tx >= 0 && ty >= 0 && tx < GW && ty < GH) g[ty * GW + tx] = 0; };
  const solid = (x0, z0, x1, z1) => { const b = { x0, x1, z0, z1 }; walls.push(b); return b; };
  const light = (x, y, z, col, int, d, fl, w = 1) => { const l = { x, y, z, col, int, base: int, bc: col, d, fl, ph: R() * 10, w }; LIGHTS.push(l); dyn.lights.push(l); return l; };
  // a piece of furniture: a box standing on the floor that you cannot walk through (y0 = bottom, o.ry in quarter turns only)
  const piece = (k, w, h, d, x, y0, z, o = {}) => { S.box(k, w, h, d, x, y0 + h / 2, z, o); if (!o.nc) { const sw = o.ry && Math.abs(Math.sin(o.ry)) > .7, ww = sw ? d : w, dd = sw ? w : d; solid(x - ww / 2, z - dd / 2, x + ww / 2, z + dd / 2); } };
  const glowL = [], bulb = (x, y, z, col, int, d, fl2) => { const c = new THREE.Color(col); glowL.push([x, y, z, c.r, c.g, c.b]); return light(x, y, z, col, int, d || 9, fl2 == null ? .05 + bad * .35 : fl2, 1); };
  // ---- floor plan: the two halls, then the rooms that open off them
  carve(0, hz0, XE, hz1); carve(bx0, hz1, XE, ZS);
  const LR = { x0: 3.0, x1: 11.2, z0: 3.0 }, KI = { x0: 5.2, x1: 13.0, z1: hz1 + 6.6 };
  carve(LR.x0, LR.z0, LR.x1, hz0); carve(KI.x0, hz1, KI.x1, KI.z1); carve(cxE - .62, ZS, cxE + .62, ZS + 1.6);
  // ---- walls

// ---------- per-frame: the way out, the little events, the camera going wrong ----------
function hFade() {

  const f = HS.fade = document.createElement('div'); f.style.cssText = 'position:fixed;inset:0;z-index:34;background:#000;opacity:0;pointer-events:none'; document.body.appendChild(f);
  const v = HS.vig = document.createElement('div'); v.style.cssText = 'position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(18,0,0,.9) 100%);transition:opacity 1.5s'; document.body.appendChild(v);
  return f;
}
function hHud(show) {

    const els = [ES.el, document.getElementById('escDrN') && document.getElementById('escDrN').parentElement, document.getElementById('escDrF') && document.getElementById('escDrF').parentElement && document.getElementById('escDrF').parentElement.parentElement];
    for (const e of els) if (e) e.style.display = show ? '' : 'none';
    for (const e of [ES.vig, ES.pulse, ES.prompt]) if (e && !show) e.style.opacity = 0;
  } catch (e) { }
}
function hUpdate(dt, t) {
  const w = world; if (!w || !w.house || !HS.active) return;

  hFade(); HS.vig.style.opacity = D.fin ? 0 : (.1 + .6 * bad).toFixed(2);
  const dist = (x, z) => Math.hypot(P.x - x, P.z - z);
  const tick = (k, a, b, fn) => { ev[k] = (ev[k] == null ? a + Math.random() * (b - a) : ev[k]) - dt; if (ev[k] <= 0) { ev[k] = a + Math.random() * (b - a); fn(); } };
  // the way out: the door opens as you get close
  const near = P.z > D.hz1 - .5 && dist(D.cxE, ZS - .6) < 3.4;
  if (near && !d.wasNear) { if (D.fin) Aud.soft(392, 588, 2.2, .05); else { Aud.tone(150, 95, 1.0, .05, 'sawtooth'); Aud.burst(320, .5, .03, 3); } } d.wasNear = near;
  d.open += ((near ? 1 : 0) - d.open) * (1 - Math.exp(-(near ? 1.7 : 1.2) * dt));
  d.leaf.rotation.y = ex.ry + ex.dirL * ((D.fin ? .25 : 0) + d.open * 1.5);
  if (d.open > .8 && d.blocked) { const i = w.walls.indexOf(d.block); if (i >= 0) w.walls.splice(i, 1); d.blocked = false; }
  else if (d.open < .6 && !d.blocked) { w.walls.push(d.block); d.blocked = true; }
  if (!HS.busy && d.open > .8 && P.z > ZS + .45) { if (D.fin) hLeave(); else hAdvance(); return; }

  if (d.tv) { d.tv.t -= dt; if (d.tv.t <= 0) { d.tv.t = .07; const im = d.tv.ctx.createImageData(64, 48), p = im.data; for (let i = 0; i < p.length; i += 4) { const v = Math.random() * 150 | 0; p[i] = v; p[i + 1] = v + 8; p[i + 2] = v + 24; p[i + 3] = 255; } d.tv.ctx.putImageData(im, 0, 0); d.tv.tex.needsUpdate = true; } }
  const ck = d.clock; if (ck) { ck.pend.rotation.x = V.clock === 1 ? Math.sin(t * 3.1) * .32 : V.clock === 2 ? Math.sin(t * 9) * .6 : 0; if (V.clock === 2) { ck.acc = (ck.acc || 0) + dt; if (ck.acc > .3) { ck.acc = 0; ck.ck.draw(Math.random() * 6.28, Math.random() * 6.28); } } }

  if (!D.fin && D.n >= 6) tick('beat', .95 - .45 * bad, .95 - .45 * bad, () => { Aud.tone(62, 40, .13, .1 + .12 * bad); setTimeout(() => Aud.tone(55, 36, .13, .08 + .1 * bad), 160); });

  }

const KI_Z = (D) => D.hz1 + 6.2;

// ---------- the loop ----------
function hReset() { HS.n = 0; HS.busy = false; HS.active = true; HS.ev = {}; HS.bl = null; HS.gh = null; }
function hSystems() {        // switch off everything that belongs to the other levels
  try { if (Mim.st !== 'idle') mimicEnd(); } catch (e) { } try { if (Scare.act) endScare(); } catch (e) { } try { rKill(); } catch (e) { }
  try { fReset(); } catch (e) { } try { escClear(); ES.wld = null; } catch (e) { }
  try { propsClear(); XS.frags.forEach(f => xDrop(f.m)); XS.frags = []; XS.wld = null; if (XS.watcher) XS.watcher.visible = false; } catch (e) { }
  try { fMute(); } catch (e) { } hHud(false);
}
function hTone(w) { libEnv(w); hemi.color.setHex(0xd9b48a); hemi.groundColor.setHex(0x3a2418); }
function hHook() {
  if (HS.hooked) return; HS.hooked = true;
  const wrap = (name, fn) => { const o = window[name]; if (typeof o !== 'function') return; window[name] = function () { return LV === 3 ? fn.apply(this, arguments) : o.apply(this, arguments); }; };
  wrap('updateEscape', () => { if (ES.wld) { escClear(); ES.wld = null; } hHud(false); });
  wrap('updateMimic', () => { });
  wrap('updateRoamers', () => { });
  wrap('updateScares', () => { });

}
async function houseEnter() {
  if (lvBusy || LV !== 0 || !world || !started) return; lvBusy = true;
  P.freeze = true; keys.clear(); joy.x = joy.y = 0; touchSprint = false; Torch.shaking = false;
  hHook(); Aud.shift(); libFade(true, 'HOME', 'Make yourself comfortable');
  await wait(1100);

  explored = new Uint8Array(GW * GH);
  const mm = $('#mm'); mm.width = GW * world.mmS; mm.height = GH * world.mmS;

  const f = hFade(); f.style.transition = 'none'; f.style.opacity = 1; void f.offsetWidth;

function hCleanup() {

async function hLeave() {            // the real way out: into the library
