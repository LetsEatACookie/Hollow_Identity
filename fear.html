<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Hollow Identity - Fear</title>
</head>

<body>
  <!-- FEAR: the "something is watching you, all the time" layer. index.html loads this file at start-up; it hooks updateExtras (extras.html), so it runs every frame.
       No audio files: everything is synthesised with the Web Audio API.
       SOUND   a steady, unchanging dark drone
               (kept deliberately minimal: a steady drone and your heartbeat. No screams, knocks, footsteps or voices.)
       SIGHT   EYES that open in the dark at the edge of your vision and vanish when you look at them · THE STALKER: a pale figure that stands far away, stares, and every
               time you look at it and look away it is closer. Let it get close enough and it runs. · a vignette that tightens and pulses with your heartbeat
       FEAR    a 0..1 number (darkness, dread, low health, how deep the level is, how close the Stalker is) drives all of it: the more scared you are, the more happens.
       The "Jumpscares" setting still switches the events, eyes and Stalker off (the drone stays). Tune everything in the FEAR object right below. -->
  <script>
'use strict';
const FEAR = {
  vol: 1,                       // overall loudness of this layer (on top of the game's volume slider)
  music: 1,                     // drone + music box + heartbeat
  firstEvent: [7, 11],          // seconds until the first thing happens
  gap: [30, 9],                 // seconds between events at fear 0 and at fear 1
  eyes: [1, 6],                 // eyes in the dark at fear 0 and at fear 1
  stalkerFirst: [28, 45],       // seconds until the Stalker first shows up on a level
  stalkerDist: [24, 19, 14, 10, 7],   // metres from you at stage 0..4 (it is closer every time you look at it)
  rush: 11,                     // metres per second when it runs
  base: [.3, .42, .55],         // starting fear on level 1 / 2 / 3
};
const FS = {
  c: null, out: null, bus: null, noise: null, d: null, wld: null, fear: .3, on: false, errs: 0, hooked: false, t0: 0,
  evT: 9, muT: 12, hbT: 1, blk: false, silT: 0, stalk: 0, stalkT: 0, lastStep: 0, trail: 0, trailT: 0, wail: 0,
  eyes: [], eyeT: 6, eyeTex: null, fig: null, figEye: null, sk: { st: 'wait', t: 30, stage: 0, look: 0, lost: 0, age: 0, whT: 6 },
  acc: 0, vig: null, fl: null, flA: 0, rushP: null, tension: 0, started: 0, pulse: 0
};
const fR = (a, b) => a + Math.random() * (b - a), fPick = (a) => a[(Math.random() * a.length) | 0], fC = (v, a, b) => Math.max(a, Math.min(b, v));
const fOn = () => typeof CFG === 'undefined' || CFG.scares !== false;

// ---------- audio graph ----------
function fBuild(ctx) {
  const c = FS.c = ctx || Aud.ctx; if (!c) return false;
  const n = c.sampleRate * 3, nb = c.createBuffer(1, n, c.sampleRate), nd = nb.getChannelData(0); let b0 = 0, mx = 0;
  for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; b0 = .97 * b0 + .12 * w; nd[i] = w * .6 + b0 * 3; mx = Math.max(mx, Math.abs(nd[i])); }
  for (let i = 0; i < n; i++) nd[i] /= mx; FS.noise = nb;
  const len = (c.sampleRate * 3.4) | 0, ir = c.createBuffer(2, len, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8); }
  const conv = c.createConvolver(); conv.buffer = ir;
  const out = c.createGain(); out.gain.value = 0; const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 5; comp.attack.value = .005; comp.release.value = .25;
  const bus = c.createGain(), wet = c.createGain(); wet.gain.value = .5; const rhp = c.createBiquadFilter(); rhp.type = 'highpass'; rhp.frequency.value = 110;
  bus.connect(out); bus.connect(wet); wet.connect(conv); conv.connect(rhp); rhp.connect(out); out.connect(comp); comp.connect(c.destination);
  FS.out = out; FS.bus = bus;
  // the drone: a minor second and a tritone over a low saw. Never resolves.
  const mkO = (type, f, det, dest, g) => { const o = c.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det; const k = c.createGain(); k.gain.value = g; o.connect(k); k.connect(dest); o.start(); return o; };
  const padLP = c.createBiquadFilter(); padLP.type = 'lowpass'; padLP.frequency.value = 240; padLP.Q.value = .7; const padG = c.createGain(); padG.gain.value = 0; padLP.connect(padG); padG.connect(bus);
  mkO('sawtooth', 55, 0, padLP, .55); mkO('sawtooth', 58.27, 0, padLP, .22); mkO('triangle', 77.78, 4, padLP, .25); mkO('sine', 110, 0, padLP, .2);
  const subG = c.createGain(); subG.gain.value = 0; subG.connect(bus); mkO('sine', 41, 0, subG, 1);
  FS.d = { padG, subG, padLP };
  return true;
}
function fPan(x, y, z, ref, roll) {
  const c = FS.c, p = c.createPanner(); p.panningModel = 'HRTF'; p.distanceModel = 'inverse'; p.refDistance = ref || 1.5; p.rolloffFactor = roll == null ? 1 : roll; p.maxDistance = 400;
  if (p.positionX) { p.positionX.value = x; p.positionY.value = y; p.positionZ.value = z; } else p.setPosition(x, y, z); p.connect(FS.bus); return p;
}
function fMove(p, x, y, z, t) { if (p.positionX) { p.positionX.linearRampToValueAtTime(x, t); p.positionY.linearRampToValueAtTime(y, t); p.positionZ.linearRampToValueAtTime(z, t); } else p.setPosition(x, y, z); }
function fListen() {
  const l = FS.c.listener, fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw), x = camera.position.x, y = camera.position.y, z = camera.position.z;
  if (l.positionX) { l.positionX.value = x; l.positionY.value = y; l.positionZ.value = z; l.forwardX.value = fx; l.forwardY.value = 0; l.forwardZ.value = fz; l.upX.value = 0; l.upY.value = 1; l.upZ.value = 0; }
  else { l.setPosition(x, y, z); l.setOrientation(fx, 0, fz, 0, 1, 0); }
}
function fAt(dist, deg, y) {                 // a point `dist` metres from you, `deg` degrees clockwise from where you look (180 = right behind you)
  const a = deg * Math.PI / 180, fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw), rx = Math.cos(P.yaw), rz = -Math.sin(P.yaw);
  return { x: P.x + fx * dist * Math.cos(a) + rx * dist * Math.sin(a), y: y == null ? 1.5 : y, z: P.z + fz * dist * Math.cos(a) + rz * dist * Math.sin(a) };
}

// ---------- voices ----------
function fHeart(v) {                         // lub-dub in the chest
  const c = FS.c, t = c.currentTime + .01; for (const [dt, f, g0] of [[0, 62, 1], [.17, 54, .7]]) {
    const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f, t + dt); o.frequency.exponentialRampToValueAtTime(34, t + dt + .16);
    g.gain.setValueAtTime(.0001, t + dt); g.gain.linearRampToValueAtTime(v * g0, t + dt + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dt + .2); o.connect(g); g.connect(FS.bus); o.start(t + dt); o.stop(t + dt + .25);
  }
}
// ---------- sight ----------
function fUi() {
  if (FS.vig) return;
  const mk = (css) => { const d = document.createElement('div'); d.style.cssText = css; document.body.appendChild(d); return d; };
  FS.vig = mk('position:fixed;inset:0;pointer-events:none;z-index:11;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 38%,rgba(0,0,0,.55) 72%,rgba(0,0,0,.95) 100%)');
  FS.fl = mk('position:fixed;inset:0;pointer-events:none;z-index:12;opacity:0;background:#fff');
}
function fEyeTex() {
  if (FS.eyeTex) return FS.eyeTex; const cv = document.createElement('canvas'); cv.width = 128; cv.height = 64; const x = cv.getContext('2d');
  for (const cx of [38, 90]) { const g = x.createRadialGradient(cx, 32, 1, cx, 32, 22); g.addColorStop(0, 'rgba(255,250,200,1)'); g.addColorStop(.25, 'rgba(255,200,120,.9)'); g.addColorStop(.6, 'rgba(255,40,30,.3)'); g.addColorStop(1, 'rgba(255,0,0,0)'); x.fillStyle = g; x.save(); x.translate(cx, 32); x.scale(.75, 1.15); x.translate(-cx, -32); x.fillRect(cx - 24, 0, 48, 64); x.restore(); }
  return FS.eyeTex = new THREE.CanvasTexture(cv);
}
function fEyeMat(o) { return new THREE.SpriteMaterial({ map: fEyeTex(), transparent: true, opacity: o || 0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }); }
function fSpot(minM, maxM, offView) {        // an open tile minM..maxM metres away with a clear line to you; offView = outside your field of view
  const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw);
  for (let i = 0; i < 70; i++) {
    const a = Math.random() * 6.283, r = fR(minM, maxM), x = P.x + Math.cos(a) * r, z = P.z + Math.sin(a) * r, tx = Math.floor(x / T), ty = Math.floor(z / T);
    if (tx < 1 || ty < 1 || tx >= GW - 1 || ty >= GH - 1 || world.g[ty * GW + tx] !== 0) continue;
    const cx = (tx + .5) * T, cz = (ty + .5) * T; if (!xSee(cx, cz)) continue;
    const d = Math.hypot(cx - P.x, cz - P.z) || 1, look = fx * (cx - P.x) / d + fz * (cz - P.z) / d; if (offView && look > .3) continue;
    return { x: cx, z: cz, d, look };
  }
  return null;
}
function fEyesTick(dt, fear) {
  const want = Math.round(FEAR.eyes[0] + (FEAR.eyes[1] - FEAR.eyes[0]) * fear), fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw); let n = 0;
  for (const e of FS.eyes) {
    if (!e.on) continue; n++; e.age += dt; const dx = e.x - P.x, dz = e.z - P.z, d = Math.hypot(dx, dz) || 1, look = (fx * dx + fz * dz) / d, los = xSee(e.x, e.z);
    if (look > .955 && los) e.seen += dt; else e.seen = Math.max(0, e.seen - dt * .5);
    if (!los) e.lost += dt; else e.lost = 0;
    if (!e.out && (e.seen > .3 || e.age > e.life || d < 3.5 || e.lost > 4)) { e.out = true; }
    e.bl -= dt; if (e.bl <= 0) { e.bl = fR(2, 6); e.blk = .16; } if (e.blk > 0) e.blk -= dt;
    let op = e.out ? e.op - dt * 4 : Math.min(.95, e.age / 2.4 * .95); e.op = Math.max(0, op);
    if (e.out && e.op <= 0) { e.on = false; e.s.visible = false; continue; }
    e.s.material.opacity = e.op * (e.blk > 0 ? .08 : 1) * (.85 + .15 * Math.sin(e.age * 3 + e.ph)); e.s.position.set(e.x, e.y, e.z); e.s.scale.set(.5 * (e.big || 1), .25 * (e.big || 1) * (e.blk > 0 ? .25 : 1), 1);
  }
  FS.eyeT -= dt; if (FS.eyeT <= 0 && n < want && fOn()) {
    FS.eyeT = fR(2, 5.5) * (1.25 - fear * .7); const sp = fSpot(7, 26, false);
    if (sp && sp.look > -.4 && sp.look < .8) {      // in your peripheral vision, or just behind it
      let e = FS.eyes.find(q => !q.on); if (!e) { const s = new THREE.Sprite(fEyeMat(0)); s.visible = false; scene.add(s); FS.eyes.push(e = { s }); }
      const low = Math.random() < .3; Object.assign(e, { on: true, out: false, x: sp.x, z: sp.z, y: low ? fR(.25, .6) : fR(1.0, 2.9), age: 0, life: fR(14, 34), seen: 0, lost: 0, op: 0, bl: fR(1, 4), blk: 0, ph: Math.random() * 6, big: low ? 1.2 : 1 }); e.s.visible = true;
    }
  }
}
function fFigure() {
  if (FS.fig) return FS.fig; const f = scareFigure().clone(); f.visible = false; scene.add(f); const s = new THREE.Sprite(fEyeMat(1)); s.scale.set(.62, .31, 1); s.position.set(0, 1.97, .17); f.add(s); FS.figEye = s; return FS.fig = f;
}
function fFlash(a, col) { fUi(); FS.fl.style.background = col || '#fff'; FS.flA = a; }
function fStalkerTick(dt) {
  const S = FS.sk, g = FS.fig || (fOn() ? fFigure() : null); if (!g) return; FS.tension = 0;
  if (!fOn()) { g.visible = false; return; }
  if (S.st === 'wait') { S.t -= dt; if (S.t <= 0 && !Scare.act && P.down <= 0) fStalkerSpawn(); return; }
  const dx = g.position.x - P.x, dz = g.position.z - P.z, d = Math.hypot(dx, dz) || 1, look = (-Math.sin(P.yaw) * dx - Math.cos(P.yaw) * dz) / d, los = xSee(g.position.x, g.position.z);
  g.rotation.y = Math.atan2(dx, dz);
  if (S.st === 'stand') {
    S.age += dt; FS.tension = fC(1 - d / 28, 0, 1);
    if (look > .86 && los) S.look += dt; else S.look = Math.max(0, S.look - dt * .7);
    S.lost = los ? 0 : S.lost + dt;
    FS.figEye.material.opacity = fC(S.age / 1.5, 0, 1) * (look > .5 ? 1 : .55);
    if (d < 2.8 || (S.look > .9 && S.stage >= 4)) return fRush();
    if (S.look > .9) {                                       // you looked: it goes. next time it is closer.
      g.visible = false; S.st = 'wait'; S.stage = Math.min(4, S.stage + 1); S.t = fR(9, 20) * (1.1 - FS.fear * .5); S.look = 0;
      return;
    }
    if (S.lost > 8 || S.age > 55 || d > 40) { g.visible = false; S.st = 'wait'; S.t = fR(8, 16); }
  } else if (S.st === 'rush') {
    const sp = FEAR.rush; g.position.x -= dx / d * sp * dt; g.position.z -= dz / d * sp * dt; g.position.y = Math.abs(Math.sin(performance.now() * .02)) * .12; FS.tension = 1; P.flickT = Math.max(P.flickT, .3);
    if (FS.rushP && FS.rushP.positionX) { FS.rushP.positionX.value = g.position.x; FS.rushP.positionZ.value = g.position.z; }
    if (d < 1.2) {                                           // it reached you
      g.visible = false; g.position.y = 0; S.st = 'wait'; S.t = fR(70, 110); S.stage = 2; S.look = 0; FS.rushP = null;
      Scare.shake = 1; P.flickT = Math.max(P.flickT, 1.8); fFlash(.95, '#fff'); setTimeout(() => fFlash(.5, '#600'), 90);
      if (typeof ES !== 'undefined' && ES.dread != null) ES.dread = Math.min(100, ES.dread + 22);
    }
  }
}
function fStalkerSpawn() {
  const S = FS.sk, m = FEAR.stalkerDist[S.stage] || 7, sp = fSpot(m * .85, m * 1.2, S.fails < 6) || (++S.fails && null);
  if (!sp) { S.t = 1.2; return; } S.fails = 0; const g = fFigure(); g.position.set(sp.x, 0, sp.z); g.visible = true; S.st = 'stand'; S.age = 0; S.look = 0; S.lost = 0; S.whT = fR(3, 6); FS.figEye.material.opacity = 0;
  if (typeof ES !== 'undefined' && ES.dread != null) ES.dread = Math.min(100, ES.dread + 4);
}
function fRush() {
  const S = FS.sk, g = FS.fig; S.st = 'rush'; Scare.shake = Math.max(Scare.shake, .3); P.flickT = 1;
}

// ---------- the director: things happen, more often the more scared you are ----------
const FEV = [['flicker', 1.5, .1], ['gaze', .7, .55]];
function fEvent(name) {
  const c = FS.c;
  if (name === 'flicker') { P.flickT = Math.max(P.flickT, fR(1, 2));
  } else if (name === 'gaze') {               // the dark is full of eyes. then all at once, none.
    for (let i = 0; i < 6; i++) { const sp = fSpot(7, 20, false); if (!sp) continue; let e = FS.eyes.find(q => !q.on); if (!e) { const s = new THREE.Sprite(fEyeMat(0)); s.visible = false; scene.add(s); FS.eyes.push(e = { s }); }
      Object.assign(e, { on: true, out: false, x: sp.x, z: sp.z, y: fR(.3, 2.8), age: 0, life: fR(5, 8), seen: -2, lost: 0, op: 0, bl: fR(1, 3), blk: 0, ph: Math.random() * 6, big: 1 }); e.s.visible = true; }
  }
}
function fDirector(dt, fear) {
  FS.evT -= dt;
  if (FS.evT <= 0 && !Scare.act && fOn()) {
    FS.evT = (FEAR.gap[0] + (FEAR.gap[1] - FEAR.gap[0]) * fear) * fR(.7, 1.3);
    const first = !FS.started; FS.started = 1; const pool = first ? [FEV[0]] : FEV.filter(e => fear >= e[2]); let w = 0; for (const e of pool) w += e[1];
    let r = Math.random() * w, pick = pool[0]; for (const e of pool) { r -= e[1]; if (r <= 0) { pick = e; break; } } fEvent(pick[0]);
  }
}

// ---------- every frame ----------
function fMute() { if (FS.out) FS.out.gain.setTargetAtTime(0, FS.c.currentTime, .15); }
function fReset() {
  FS.wld = world; for (const e of FS.eyes) { e.on = false; e.s.visible = false; } if (FS.fig) FS.fig.visible = false;
  Object.assign(FS.sk, { st: 'wait', t: fR(FEAR.stalkerFirst[0], FEAR.stalkerFirst[1]) * (FS.started ? .5 : 1), stage: 0, look: 0, lost: 0, age: 0, fails: 0 }); FS.rushP = null;
  FS.evT = FS.started ? fR(6, 12) : fR(FEAR.firstEvent[0], FEAR.firstEvent[1]); FS.stalk = 0; FS.eyeT = 3;
}
function updateFear(dt, t) {
  if (!started || P.escaped || !Aud.ctx) { fMute(); return; }
  if (!FS.c || FS.c !== Aud.ctx) { if (!fBuild()) return; FS.on = true; }
  if (!FS.hooked) { FS.hooked = true; const sh = Aud.shift; Aud.shift = function () { if (FS.inX) return; return sh.apply(this, arguments); }; X.whisperEvery = [1e9, 1e9]; X.blackEvery = [75, 150]; X.watchEvery = [1e6, 1e6]; }
  if (FS.wld !== world) fReset(); fUi(); fListen(); dt = Math.min(dt, .1);
  // fear: 0..1
  const dark = !P.flash || (typeof Torch !== 'undefined' && Torch.k < .3), dread = (typeof ES !== 'undefined' && ES.dread) ? ES.dread / 100 : 0;
  const target = fC(FEAR.base[Math.min(2, LV)] + (dark ? .18 : 0) + dread * .35 + (P.hp < 50 ? .14 : 0) + Math.min(.15, (t - (FS.t0 || (FS.t0 = t))) / 900) + FS.tension * .3 + FS.sk.stage * .03 + (typeof XS !== 'undefined' && XS.black > 0 ? .25 : 0), 0, 1);
  FS.fear += (target - FS.fear) * (1 - Math.exp(-.5 * dt)); const f = FS.fear, on = fOn(), now = FS.c.currentTime;
  const m = FEAR.music;
  // levels
  FS.out.gain.setTargetAtTime(FEAR.vol * (CFG.vol / 100) * 1.25, now, .1); const d = FS.d;
  d.padG.gain.setTargetAtTime(.08 * m, now, 1); d.subG.gain.setTargetAtTime(.05 * m, now, 1);
  // heartbeat (louder and faster as fear and the Stalker's closeness rise)
  const maxS = 100 * (has('sprinter') ? 1.5 : 1) * (me.q === 'shortbreath' ? .6 : 1), stam = P.exh ? 1 : fC((.35 - P.stam / maxS) / .35, 0, 1);   // 0 above 35% stamina, 1 when empty
  const hb = Math.max((f - .5) * 1.6, FS.tension * .9, stam * .95); FS.hbT -= dt; if (hb > .05 && FS.hbT <= 0 && true) { FS.hbT = 1.15 - .65 * hb; FS.pulse = 1; fHeart((.1 + .5 * hb) * m); }
  FS.pulse = Math.max(0, FS.pulse - dt * 3);
  // vignette + flash
  FS.vig.style.opacity = on ? fC(.25 + .55 * f + FS.pulse * .12 * hb + FS.tension * .25, 0, 1).toFixed(3) : '0';
  if (FS.flA > .01) { FS.flA = Math.max(0, FS.flA - dt * 2.2); FS.fl.style.opacity = FS.flA.toFixed(2); } else if (FS.fl.style.opacity !== '0') FS.fl.style.opacity = 0;
  camera.rotation.z += Math.sin(t * .37) * .0045 * f;                         // the world never quite sits level
  if (!on) { for (const e of FS.eyes) { e.on = false; e.s.visible = false; } if (FS.fig) FS.fig.visible = false; return; }
  // the unseen
  if (FS.stalk > 0) FS.stalk -= dt; fDirector(dt, f); fEyesTick(dt, f); fStalkerTick(dt);
}
// no scary text on screen, ever: this silences extras.html's whispers and escape.html's "behind you" / "breathe" lines (toasts about items and the exit still show)
xWhisper = function () { };
{ const ux = updateExtras; updateExtras = function (dt, t) { FS.inX = true; try { ux(dt, t); } finally { FS.inX = false; } if (FS.errs > 6) return; try { updateFear(dt, t); } catch (e) { FS.errs++; console.error('fear.html:', e); } }; }
  </script>
</body>
